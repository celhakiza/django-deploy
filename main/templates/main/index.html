<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body>

<div class="container">
    <h1  style="text-align: center;"><span style="color: blue;">Manufacturing Dashboard</span></h1>
    <div class="row">
       <div class="col-3 my-4">
        <div class="card bg-info">
        <div class="card-body">
            <h5 class="card-title text-center">Transactions</h5>
            <p class="card-text text-white text-center">{{ transactions }}</p>
        </div>
        </div>
       </div>

       <div class="col-3 my-4">
        <div class="card bg-warning">
        <div class="card-body">
            <h5 class="card-title text-center">Costs</h5>
            <p class="card-text text-white text-center">{{cost}} RWF</p>
        </div>
        </div>
       </div>

        <div class="col-3 my-4">
        <div class="card bg-primary">
        <div class="card-body">
            <h5 class="card-title text-center">Revenues</h5>
            <p class="card-text text-white text-center">{{revenue}} RWF</p>
        </div>
        </div>
       </div>

       <div class="col-3 my-4">
        <div class="card bg-secondary">
        <div class="card-body">
            <h5 class="card-title text-center">Profits</h5>
            <p class="card-text text-white text-center">{{profits}} RWF</p>
        </div>
        </div>
       </div>

    </div>

    <div class="row">
        <div class="col-6 my-6">
            <div class="card-body">
                <h4 class="Card-title">Profits by location</h4>
                <canvas id="userChart"></canvas>

            </div>
        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>





</body>
</html>
